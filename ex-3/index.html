<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Registration Form</title>
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #c3cfe2, #f5f7fa); /* Cool gradient */
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
  min-height: 100vh;
}
.container {
  background: #ffffff;
  padding: 40px 35px;
  border-radius: 16px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.15);
  max-width: 420px;
  width: 100%;
  animation: fadeIn 0.9s ease-in-out;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}
h2 {
  color: #2c3e50;
  text-align: center;
  margin-bottom: 30px;
  font-weight: 800;
  letter-spacing: 1.5px;
  font-size: 24px;
}
form {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* Floating label input style */
.input-group {
  position: relative;
}
.input-group input,
.input-group select,
.input-group textarea {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  border: 1.5px solid #ccc;
  border-radius: 8px;
  outline: none;
  background: transparent;
  box-sizing: border-box;
}
.input-group label {
  position: absolute;
  top: 12px;
  left: 12px;
  color: #888;
  font-size: 14px;
  pointer-events: none;
  transition: 0.25s ease;
}
.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label,
.input-group select:focus + label,
.input-group select:not([value=""]) + label,
.input-group textarea:focus + label,
.input-group textarea:not(:placeholder-shown) + label {
  top: -8px;
  left: 10px;
  background: #fff;
  padding: 0 5px;
  font-size: 12px;
  color: #6c5ce7; /* Stylish purple highlight */
}
input[type="date"] {
  padding: 11px;
}
.gender-group {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  padding: 8px 0;
}
.gender-group label {
  font-weight: 600;
  color: #333;
}
textarea {
  min-height: 65px;
  resize: vertical;
}
input[type="submit"] {
  background: linear-gradient(135deg, #6c5ce7, #0984e3);
  color: white;
  font-weight: 700;
  font-size: 16px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 10px;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
input[type="submit"]:hover {
  background: linear-gradient(135deg, #4834d4, #0652dd);
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  transform: translateY(-2px);
}
</style>
</head>
<body>
<div class="container">
  <h2>Registration Form</h2>
  <form id="registrationForm">
    <div class="input-group">
      <input type="text" id="name" placeholder=" " />
      <label for="name">Full Name</label>
    </div>
    <div class="input-group">
      <input type="text" id="email" placeholder=" " />
      <label for="email">Email</label>
    </div>
    <div class="input-group">
      <input type="text" id="phone" placeholder=" " />
      <label for="phone">Phone Number</label>
    </div>
    <div class="input-group">
      <select id="state" value="">
        <option value="" disabled selected hidden></option>
        <option value="Andhra Pradesh">Andhra Pradesh</option>
        <option value="Delhi">Delhi</option>
        <option value="Karnataka">Karnataka</option>
        <option value="Maharashtra">Maharashtra</option>
        <option value="Tamil Nadu">Tamil Nadu</option>
        <option value="Uttar Pradesh">Uttar Pradesh</option>
      </select>
      <label for="state">State</label>
    </div>
    <div class="input-group">
      <input type="date" id="dob" placeholder=" " />
      <label for="dob">Date of Birth</label>
    </div>
    <div class="input-group">
      <input type="text" id="aadhaar" placeholder=" " />
      <label for="aadhaar">Aadhaar Number</label>
    </div>
    <div class="gender-group">
      <label><input type="radio" name="gender" value="Male" /> Male</label>
      <label><input type="radio" name="gender" value="Female" /> Female</label>
    </div>
    <div class="input-group">
      <input type="password" id="password" placeholder=" " />
      <label for="password">Password</label>
    </div>
    <div class="input-group">
      <input type="password" id="confirmPassword" placeholder=" " />
      <label for="confirmPassword">Confirm Password</label>
    </div>
    <div class="input-group">
      <textarea id="address" placeholder=" "></textarea>
      <label for="address">Address</label>
    </div>
    <div class="input-group">
      <input type="text" id="creditCard" placeholder=" " />
      <label for="creditCard">Credit Card Number</label>
    </div>
    <input type="submit" value="Register" />
  </form>
</div>
<script>
document.getElementById('registrationForm').addEventListener('submit', function(e) {
  e.preventDefault(); // Prevent default form submission
  validateForm();
});

function validateForm() {
  let namePattern = /^[A-Za-z\s]+$/;
  let emailPattern = /^[\w\.-]+@[A-Za-z]+\.[A-Za-z]{2,}$/;
  let phonePattern = /^\d{10}$/;
  let aadhaarPattern = /^\d{12}$/;
  let passwordPattern = /^(?=.*\d)(?=.*[A-Za-z]).{8,}$/;  // Fixed regex
  let creditCardPattern = /^\d{16}$/;
  
  let name = document.getElementById("name").value.trim();
  let email = document.getElementById("email").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let state = document.getElementById("state").value;
  let dob = document.getElementById("dob").value;
  let aadhaar = document.getElementById("aadhaar").value.trim();
  let password = document.getElementById("password").value;
  let confirmPassword = document.getElementById("confirmPassword").value;
  let address = document.getElementById("address").value.trim();
  let creditCard = document.getElementById("creditCard").value.trim();
  
  let genderElems = document.getElementsByName("gender");
  let genderSelected = false;
  for(let i=0; i < genderElems.length; i++){
    if(genderElems[i].checked){ genderSelected = true; break; }
  }

  // Validation checks
  if (!namePattern.test(name)) { 
    alert("Enter a valid name (letters and spaces only)."); 
    return false; 
  }
  
  if (!emailPattern.test(email)) { 
    alert("Enter a valid email (e.g., example@domain.com)."); 
    return false; 
  }
  
  if (!phonePattern.test(phone)) { 
    alert("Enter a 10-digit phone number."); 
    return false; 
  }
  
  if (state === "") { 
    alert("Please select your state."); 
    return false; 
  }
  
  if (!dob) { 
    alert("Please enter your date of birth."); 
    return false; 
  } else {
    let dobDate = new Date(dob);
    let today = new Date();
    let minAgeDate = new Date();
    minAgeDate.setFullYear(today.getFullYear() - 18);
    
    if (dobDate >= today) { 
      alert("Date of birth cannot be in the future."); 
      return false; 
    }
    if (dobDate > minAgeDate) {
      alert("You must be at least 18 years old to register.");
      return false;
    }
  }
  
  if (!aadhaarPattern.test(aadhaar)) { 
    alert("Enter a 12-digit Aadhaar number."); 
    return false; 
  }
  
  if (!genderSelected) { 
    alert("Please select your gender."); 
    return false; 
  }
  
  if (!passwordPattern.test(password)) { 
    alert("Password must include both letters and numbers, and be at least 8 characters long."); 
    return false; 
  }
  
  if (password !== confirmPassword) { 
    alert("Passwords do not match."); 
    return false; 
  }
  
  if (address.length < 10) { 
    alert("Please enter a valid address (minimum 10 characters)."); 
    return false; 
  }
  
  if (!creditCardPattern.test(creditCard)) { 
    alert("Enter a 16-digit credit card number."); 
    return false; 
  }

  // If all validations pass
  let now = new Date();
  let submissionDate = now.toLocaleDateString();
  alert("Registration Successful!\nSubmission Date: " + submissionDate);
  return true;
}
</script>
</body>
</html>
